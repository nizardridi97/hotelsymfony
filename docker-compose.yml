version: '3.8'

services:
  hotel:
    build: .
    container_name: hotel_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - database
    environment:
      DATABASE_URL: "mysql://root:root@database:3306/hotele_la_palme"
  
  apache:
    build: .
    container_name: hotel_apache
    depends_on:
      - hotel
    ports:
      - "8000:80"  # Apache écoutera sur le port 80 à l'intérieur du conteneur et le mappe sur le port 8000 sur l'hôte
    volumes:
      - .:/var/www/html
      - ./apache.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public

  database:
    image: mysql:8.0
    container_name: hotel_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotele_la_palme
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hotel_pma
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database
      MYSQL_ROOT_PASSWORD: root

volumes:
  db_data:
